name: Aviso de deploy de produção

# A Vercel grava cada deploy como "deployment" do GitHub (ambiente
# "Production" ou "Preview") e manda o status dele. Este workflow lê esses
# status: falha em Production abre uma issue para o dono do repositório, e o
# próximo sucesso fecha. O porquê está em .github/scripts/aviso-deploy.cjs.
#
# `deployment_status` roda o workflow do branch padrão — mudança aqui só vale
# depois de entrar no master.
on: deployment_status

permissions:
  contents: read
  issues: write

jobs:
  avisar:
    if: github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const avisoDeploy = require("./.github/scripts/aviso-deploy.cjs");
            core.info(await avisoDeploy({ github, context }));
