# Verificação automática em todo PR e no master.
#
# POR QUE ISTO EXISTE. Em 12/08/2026 o `scripts/test-nr01.ts` estava vermelho
# havia cinco dias e ninguém sabia: os testes só rodavam quando um humano
# lembrava de digitar o comando. Num sistema que calcula férias, ponto e risco
# psicossocial, "alguém lembra de rodar" não é verificação — é sorte.
#
# O QUE RODA. Dois jogos: as regras puras (job `verificar`, sem banco) e os 27
# smokes contra um Postgres de verdade (job `smokes-com-banco`, serviço de
# banco descartável). Os smokes ficaram de fora até 12/08/2026 "porque exigiria
# um serviço de banco no CI, que é outra decisão" — a decisão foi tomada, e a
# primeira rodada em banco novo já pagou o ingresso: dois smokes reprovaram
# porque o banco de CI não tinha as regras escritas em SQL à mão (CHECK do alvo
# da meta, índice parcial de rascunho) — ver scripts/ci-extras-banco.sql.
#
# NÃO substitui o `next build` da Vercel: aquele é a compilação de verdade e já
# roda em todo deploy. Aqui é o que a Vercel não checa — type-check, lint e as
# regras de negócio.

name: Verificação

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `--ignore-scripts` não serve: o postinstall roda `prisma generate`, e
      # sem o client gerado o type-check falha em todo arquivo que importa
      # @/app/generated/prisma.
      - run: npm ci

      - name: Type-check
        run: npm run type-check

      # Ligado em 12/08/2026, depois de zerar os 10 erros que existiam quando
      # este arquivo nasceu. O portão ficou desligado nas primeiras horas de
      # propósito: CI que nasce vermelho é CI que todo mundo aprende a ignorar.
      #
      # Restam 43 AVISOS (imports sem uso, sobretudo), que não quebram o passo.
      # Transformá-los em erro é decisão para outro dia — e, se for tomada,
      # zerar antes de ligar, como foi feito aqui.
      - name: Lint
        run: npm run lint

      # Um passo por script, e não um laço: com laço, o log mostra só "falhou"
      # e alguém precisa abrir o output inteiro para achar qual. Aqui o próprio
      # nome do passo que fica vermelho já diz o que quebrou.
      - name: Regras de férias (CLT art. 130, 134, 137, 143)
        run: npx tsx scripts/test-ferias.ts
      - name: Regras de ponto (CLT art. 58, 59, 73 e Portaria MTP 671)
        run: npx tsx scripts/test-ponto.ts
      - name: Risco psicossocial (NR-01)
        run: npx tsx scripts/test-nr01.ts
      - name: Conformidade (ASO, NR, EPI)
        run: npx tsx scripts/test-conformidade.ts
      - name: Escala de trabalho
        run: npx tsx scripts/test-escala.ts
      - name: Admissão
        run: npx tsx scripts/test-admissao.ts
      - name: Indicadores (BI)
        run: npx tsx scripts/test-bi.ts
      - name: Produtividade
        run: npx tsx scripts/test-produtividade.ts
      - name: Bloqueio por tentativas de login
        run: npx tsx scripts/test-login-tentativas.ts
      - name: Resultado de pesquisa eNPS
        run: npx tsx scripts/test-pesquisa-enps-resultado.ts
      - name: Pendências por natureza e saudação
        run: npx tsx scripts/test-pendencias-natureza.ts
      - name: Telefone, CPF e varredura de duplicados
        run: npx tsx scripts/test-telefone.ts
      - name: Marcação de ponto repetida no mesmo dia (fuso de Brasília)
        run: npx tsx scripts/test-ponto-duplicado.ts
      - name: Teto de jornada do estagiário (5h/dia, 30h/semana)
        run: npx tsx scripts/test-ponto-estagio.ts
      - name: Permissões de usuário (sistema nunca fica sem ADMIN)
        run: npx tsx scripts/test-usuarios-permissoes.ts
      - name: Apuração de pesquisa pergunta a pergunta
        run: npx tsx scripts/test-pesquisa-apuracao.ts
      - name: Entregas ao colaborador (confirmação e devolução)
        run: npx tsx scripts/test-entregas.ts
      - name: Foto obrigatória na batida de ponto
        run: npx tsx scripts/test-ponto-foto.ts
      - name: Marcação incluída por tratamento (dia certo, hash próprio, fora do AFD)
        run: npx tsx scripts/test-ponto-tratada.ts

  # Os 29 smokes contra Postgres de verdade. O banco nasce vazio a cada
  # execução: schema gerado do prisma/schema.prisma via `migrate diff` (o
  # `migrate deploy` não serve — o histórico de migrations não é reproduzível
  # do zero, ver prisma/checar-migracoes.mjs), MAIS as regras de SQL manual que
  # o schema não expressa (scripts/ci-extras-banco.sql), MAIS a empresa-palco
  # mínima que scripts/_empresa-de-teste.ts exige (scripts/ci-fixture-banco.ts).
  # Receita validada localmente em 15/08/2026: 29/29.
  smokes-com-banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rhci
          POSTGRES_PASSWORD: rhci
          POSTGRES_DB: rhtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rhci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rhci:rhci@localhost:5432/rhtest
      PGPASSWORD: rhci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Criar o schema no banco descartável
        run: |
          npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script > /tmp/schema.sql
          psql -h localhost -U rhci -d rhtest -q -v ON_ERROR_STOP=1 -f /tmp/schema.sql
          psql -h localhost -U rhci -d rhtest -q -v ON_ERROR_STOP=1 -f scripts/ci-extras-banco.sql

      - name: Semear a empresa-palco
        run: npx tsx scripts/ci-fixture-banco.ts
        env:
          SEED_ADMIN_USERNAME: admin.ci

      # Estes três precisam de banco e por isso não cabiam no job de cima —
      # mas também não são smoke, então em 13/08/2026 estavam em job NENHUM:
      # rodavam só quando alguém lembrava, que é a situação que este workflow
      # nasceu para acabar (ver o cabeçalho sobre o test-nr01).
      - name: Desacoplamento do banco (tabela de usuários própria)
        run: npx tsx scripts/test-desacoplamento.ts
        env:
          SEED_ADMIN_USERNAME: admin.ci
      - name: Portal do colaborador (link e sessão)
        run: npx tsx scripts/test-portal.ts
      - name: Reconhecimento (aniversários e tempo de casa)
        run: npx tsx scripts/test-reconhecimento.ts

      # Um passo por smoke, e não um laço — mesmo motivo do job acima: o nome
      # do passo vermelho já diz o que quebrou.
      - name: Alertas de RH
        run: npx tsx scripts/smoke-alertas-rh.ts
      - name: Recrutamento (ATS)
        run: npx tsx scripts/smoke-ats.ts
      - name: Avaliação de desempenho
        run: npx tsx scripts/smoke-avaliacao.ts
      - name: Benefícios
        run: npx tsx scripts/smoke-beneficios.ts
      - name: Acidente de trabalho (CAT)
        run: npx tsx scripts/smoke-cat.ts
      - name: Ciclo de pesquisas
        run: npx tsx scripts/smoke-ciclo-pesquisa.ts
      - name: Cobrança de cadastro
        run: npx tsx scripts/smoke-cobranca-cadastro.ts
      - name: Departamento pessoal
        run: npx tsx scripts/smoke-dp.ts
      - name: Entrega de EPI
        run: npx tsx scripts/smoke-epi.ts
      - name: Entregas ao colaborador (lote, confirmação, devolução)
        run: npx tsx scripts/smoke-entregas.ts
      - name: Escalas
        run: npx tsx scripts/smoke-escala.ts
      - name: Estrutura (marca, empresa, setor)
        run: npx tsx scripts/smoke-estrutura.ts
      - name: Folha (eventos variáveis)
        run: npx tsx scripts/smoke-folha.ts
      - name: Importação de colaboradores
        run: npx tsx scripts/smoke-importacao.ts
      - name: Login e usuários
        run: npx tsx scripts/smoke-login.ts
      - name: Metas e PDI
        run: npx tsx scripts/smoke-metas.ts
      - name: Movimentações
        run: npx tsx scripts/smoke-movimentacoes.ts
      - name: Offboarding
        run: npx tsx scripts/smoke-offboarding.ts
      - name: Onboarding
        run: npx tsx scripts/smoke-onboarding.ts
      - name: Pendências
        run: npx tsx scripts/smoke-pendencias.ts
      - name: NSR do ponto não repete (corrida na virada de turno)
        run: npx tsx scripts/smoke-ponto-nsr.ts
      - name: Pesquisa de desligamento
        run: npx tsx scripts/smoke-pesquisa-desligamento.ts
      - name: Pesquisa eNPS
        run: npx tsx scripts/smoke-pesquisa-enps.ts
      - name: Pesquisa de onboarding
        run: npx tsx scripts/smoke-pesquisa-onboarding.ts
      - name: Vínculo de pesquisa
        run: npx tsx scripts/smoke-pesquisa-vinculo.ts
      - name: Reconhecimento
        run: npx tsx scripts/smoke-reconhecimento.ts
      - name: Régua de cobrança
        run: npx tsx scripts/smoke-regua-cobranca.ts
      - name: Segurança do trabalho (SST)
        run: npx tsx scripts/smoke-sst.ts
      - name: Treinamentos
        run: npx tsx scripts/smoke-treinamentos.ts
