name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sistemadorh
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sistemadorh?schema=rh
      AUTH_SECRET: ci-only-secret-nao-usar-em-producao
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # Sem passo de migrations: este histórico NÃO é reproduzível do zero.
      # Ele carrega migrations de quando o banco era dividido com o
      # lm-bonificacao (schemas `shared` e `bonificacao`), migrations de
      # reconciliação que nunca foram feitas para executar, e trechos aplicados
      # à mão fora do fluxo do Prisma. Tentar `prisma migrate deploy` num banco
      # vazio (04/08/2026) morreu em cadeia e reprovou toda PR aberta.
      #
      # O `checar-migracoes.mjs` dentro do build se reconhece no GitHub Actions
      # e se pula — a pergunta dele é sobre o banco de PRODUÇÃO, e quem a
      # responde é o build da Vercel, no deploy.
      - name: Build
        run: npm run build

  # Deploy é automático: a integração nativa Vercel↔GitHub builda e publica
  # a cada push no master, sem precisar de step aqui. Este workflow só
  # garante que o que está subindo passou por type-check/lint/migrations/
  # build antes — não substitui nem duplica o deploy da Vercel.
